<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>动画总览</title>
<style>
:root{--bg:#f6f8f2;--card:#fdfef9;--ink:#2c4633;--muted:#606f5d;--line:#d6dfce;--accent:#376749}
html[data-dark=true]{--bg:#151c18;--card:#202a23;--ink:#e3ecdf;--muted:#abb9a7;--line:#425342;--accent:#b4c9a8}
body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px}
button[aria-pressed=true]{background:var(--accent);color:var(--card)}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px}
iframe{width:100%;aspect-ratio:1;border:0;display:block;background:transparent}
figcaption{font-size:13px;padding:6px 4px 2px;color:var(--muted)}figcaption b{color:var(--ink);display:block}
h2{grid-column:1/-1;margin:10px 0 0;font-size:16px}
</style></head>
<body>
<header>
  <select id="topic"></select>
  <button data-mode="motion" aria-pressed="true">全身动作</button><button data-mode="detail">细节图解</button><button data-mode="mistakes">错误对照</button>
  <button id="play" aria-pressed="true">播放</button>
  <input id="t" type="range" min="0" max="1" step="0.01" value="0" style="width:220px"><span id="tv"></span>
  <button id="dark">深色</button>
</header>
<main id="grid"></main>
<script type="module">
const base = '/Sources/SteadyCore/Resources/TrainingCollections/Reviewed/';
const topics = {shoulders: 'shoulders-animations.json', arms: 'arms-animations.json', 'arms-extra': 'arms-extra-complete-animations.json',
  chest: 'chest-animations.json', back: 'back-animations.json', abs: 'abs-animations.json', legs: 'legs-animations.json', functional: 'functional-animations.json', equipment: null};
const EQUIP = ['ChestPressArtwork', 'LatPulldownArtwork', 'CableRowArtwork', 'LegPressArtwork', 'ShoulderPressArtwork', 'LegExtensionArtwork',
  'AbdominalCrunchArtwork', 'GobletSquatArtwork', 'DumbbellRowArtwork', 'DumbbellShoulderPressArtwork', 'LegCurlArtwork', 'BicepsCurlArtwork', 'PecFlyArtwork', 'HipAbductionArtwork'];
const sel = document.getElementById('topic');
Object.keys(topics).forEach(t => sel.add(new Option(t, t)));
const q = new URLSearchParams(location.search); sel.value = Object.hasOwn(topics, q.get('topic')) ? q.get('topic') : 'shoulders';
let mode = ['motion', 'detail', 'mistakes'].includes(q.get('mode')) ? q.get('mode') : 'motion';
let dark = q.get('dark') === '1', playing = !q.has('t'), frac = Math.min(1, Math.max(0, +q.get('t') || 0)), rev = 1, loadRevision = 0;
document.documentElement.dataset.dark = dark;
const frames = [];
function frameStatus(f, state, message = '') {
  f.dataset.state = state;
  f.dataset.message = message;
  const note = f.parentElement.querySelector('[data-frame-status]');
  note.textContent = message; note.hidden = !message;
}
function sendFrame(f) {
  // A failed navigation can leave Chromium's opaque error document in the frame,
  // even when iframe.src still displays the expected same-origin URL.
  try {
    const w = f.contentWindow;
    if (!w || !f.contentDocument || f.contentDocument.readyState !== 'complete' || w.location.href === 'about:blank') {
      frameStatus(f, f.dataset.loaded === 'true' ? 'unavailable' : 'loading',
        f.dataset.loaded === 'true' ? '页面未就绪，请检查本地服务后重新加载。' : '');
      return false;
    }
    if (typeof w.setLessonState !== 'function' || !w.SteadyLesson) {
      frameStatus(f, 'unavailable', '新版图解尚未就绪，请完成生成后重新加载。');
      return false;
    }
    const T = w.SteadyLesson.timing;
    if (!T || !Number.isFinite(T.duration) || T.duration <= 0) throw new Error('Invalid lesson timing');
    w.setLessonState({mode, playing, speed: 1, seekTime: frac * T.duration, seekRevision: rev, dark, timing: T});
    frameStatus(f, 'ready');
    return true;
  } catch (error) {
    frameStatus(f, 'unavailable', '本课页面无法访问或播放，请检查本地服务和引擎。');
    return false;
  }
}
function send() {
  for (const f of frames) sendFrame(f);
  document.getElementById('tv').textContent = playing ? '' : Math.round(frac * 100) + '%';
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  document.getElementById('play').setAttribute('aria-pressed', playing);
  document.getElementById('dark').setAttribute('aria-pressed', dark);
}
async function load() {
  const currentLoad = ++loadRevision;
  const grid = document.getElementById('grid'); grid.innerHTML = ''; frames.length = 0;
  const t = sel.value;
  let items;
  if (topics[t]) {
    const response = await fetch(base + t + '/' + topics[t]);
    if (!response.ok) throw new Error(`Cannot load ${t}: ${response.status}`);
    const m = await response.json();
    if (currentLoad !== loadRevision) return;
    items = m.animations.map(a => ({src: base + t + '/' + a.resource, title: a.lessonID, sub: (a.primaryMuscles || []).join('、')}));
  } else items = EQUIP.map(r => ({src: '/Steady/' + r + '.html', title: r, sub: ''}));
  if (q.has('lesson')) {
    items = items.filter(it => it.title === q.get('lesson'));
    if (!items.length) throw new Error(`Unknown lesson: ${q.get('lesson')}`);
  }
  let loadingBatch = [];
  for (const it of items) {
    if (currentLoad !== loadRevision) return;
    const fig = document.createElement('figure');
    const f = document.createElement('iframe');
    f.loading = 'eager';
    const caption = document.createElement('figcaption'), title = document.createElement('b'), note = document.createElement('div');
    note.dataset.frameStatus = ''; note.hidden = true; note.setAttribute('role', 'status');
    title.textContent = it.title; caption.append(title, document.createTextNode(it.sub), note);
    fig.append(f, caption);
    grid.appendChild(fig);
    f.dataset.loaded = 'false'; f.dataset.state = 'loading';
    const loaded = new Promise(resolve => {
      const timer = setTimeout(() => {
        if (f.dataset.state === 'loading') frameStatus(f, 'unavailable', '页面加载超时，请检查本地服务后重新加载。');
        resolve();
      }, 15000);
      f.addEventListener('load', () => {
        f.dataset.loaded = 'true'; sendFrame(f); clearTimeout(timer); resolve();
      });
      f.addEventListener('error', () => {
        frameStatus(f, 'unavailable', '页面加载失败，请检查本地服务。'); clearTimeout(timer); resolve();
      });
    });
    f.src = it.src + '?' + Date.now();
    frames.push(f);
    loadingBatch.push(loaded);
    // A small local HTTP server can reset a burst of 11–14 simultaneous requests.
    // Keep the gallery responsive while filling every card in bounded batches.
    if (loadingBatch.length === 2) { await Promise.all(loadingBatch); loadingBatch = []; }
  }
  await Promise.all(loadingBatch);
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; send(); });
document.getElementById('play').onclick = () => { playing = !playing; send(); };
document.getElementById('dark').onclick = () => { dark = !dark; document.documentElement.dataset.dark = dark; send(); };
document.getElementById('t').oninput = e => { frac = +e.target.value; playing = false; rev++; send(); };
window.gallery = {send,
  status: () => frames.map(f => ({src: f.src, state: f.dataset.state, message: f.dataset.message || ''})),
  set: (o) => { if ('mode' in o) mode = o.mode; if ('frac' in o) { frac = Math.min(1, Math.max(0, +o.frac || 0)); playing = false; rev++; } if ('dark' in o) { dark = o.dark; document.documentElement.dataset.dark = dark; } send(); }};
function loadTopic() {
  const requestedLoad = loadRevision + 1;
  return load().then(() => { if (requestedLoad === loadRevision) send(); }).catch(error => {
    if (requestedLoad === loadRevision) document.getElementById('grid').textContent = '课程清单无法加载，请检查本地服务后重新加载。';
    console.error(error);
  });
}
sel.onchange = loadTopic;
loadTopic();
</script>
</body></html>
