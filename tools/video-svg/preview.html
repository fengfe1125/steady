<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steady · 真人视频还原 SVG</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ee;color:#2d4937;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 8px}p{color:#697c6f;line-height:1.6}nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,select{border:1px solid #c6d0c1;background:#fff;color:#2d4937;border-radius:12px;padding:11px 15px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2d4937;color:#fff}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border-radius:22px;padding:18px}iframe{display:block;border:0;width:100%;height:430px}video{width:100%;height:360px;object-fit:contain;background:#fff;border-radius:16px}.caption{font-size:13px;color:#697c6f}input{width:100%}.dark{background:#1e2822;color:#e6ece6}.dark .card{background:#26372d}.dark p,.dark .caption{color:#bccab9}@media(max-width:720px){main{padding:16px}.panels{grid-template-columns:1fr}iframe{height:390px}}</style>
<main><h1>真人视频 → SVG 动作教学</h1><p>第一阶段 · 六个动作。左侧为离线矢量动画；右侧为无声参考副本。原有教学与计划用量保持独立。</p><nav id="actions"></nav><h2 id="title"></h2><div class="controls"><button id="play">播放</button><select id="speed"><option value="1">正常 1×</option><option value="0.5">慢放 0.5×</option></select><select id="mode"><option value="motion">全身动作</option><option value="detail">细节图解</option><option value="mistakes">错误对照</option></select><button id="theme">深色 / 浅色</button><button id="compare">从参考片段起点同时播放</button></div><div class="panels"><div class="card"><iframe id="art" title="SVG 动作教学"></iframe><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="动作进度"><div id="time" class="caption"></div></div><div class="card"><video id="video" muted controls playsinline preload="metadata"></video><p id="source" class="caption"></p></div></div><p id="notes"></p></main>
<script>
const root='../../Sources/SteadyCore/Resources/TrainingCollections/VideoReferences/',evidence='../../docs/verification/video-svg-phase1/';let rows=[],current,playing=false,dark=false,revision=0;
const $=id=>document.getElementById(id),art=$('art');function command(seek){if(!art.contentWindow?.setLessonState)return;const c={mode:$('mode').value,playing,speed:Number($('speed').value),dark};if(seek!==undefined){c.seekRevision=++revision;c.seekTime=seek;}art.contentWindow.setLessonState(c);$('play').textContent=playing?'暂停':'播放';}
function choose(r){current=r;playing=false;$('mode').value='motion';$('seek').value=0;$('title').textContent=r.lesson.title+' · '+r.variant;art.src=root+r.animation.resource;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===r.id));fetch(evidence+r.key+'/dossier.json').then(x=>x.json()).then(d=>{$('video').src=evidence+'.cache/videos/'+r.key+'.mp4';$('source').textContent='参考片段 '+d.cycle[0].toFixed(2)+'–'+d.cycle[1].toFixed(2)+' 秒 · '+d.sourceID;$('notes').textContent=d.observation;current.dossier=d;});}
art.addEventListener('load',()=>{command(0);});$('play').onclick=()=>{playing=!playing;command();};$('speed').onchange=()=>command();$('mode').onchange=()=>{playing=false;command();};$('seek').oninput=()=>{playing=false;command(Number($('seek').value)*current.animation.durationSeconds*1000);};$('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);command();};$('compare').onclick=()=>{if(!current.dossier)return;$('mode').value='motion';$('video').currentTime=current.dossier.cycle[0];$('video').playbackRate=Number($('speed').value);$('video').play();playing=true;command(0);};$('video').addEventListener('timeupdate',()=>{if(current?.dossier&&$('video').currentTime>=current.dossier.cycle[1]){$('video').pause();playing=false;command(current.animation.durationSeconds*1000);}});document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;command();$('video').pause();}});
setInterval(()=>{const s=art.contentWindow?.SteadyLessonPlaybackState?.();if(!s)return;$('seek').value=s.time/s.duration;$('time').textContent=(s.time/1000).toFixed(2)+' / '+(s.duration/1000).toFixed(2)+' 秒';},100);
fetch(root+'lessons.json').then(r=>r.json()).then(data=>{const keys=['squat','crunch','goblet','lateral','legpress','shoulderpress'];rows=data.map((r,i)=>({...r,key:keys[i]}));for(const r of rows){const b=document.createElement('button');b.textContent=r.lesson.title.replace(' · 视频还原','');b.dataset.id=r.id;b.onclick=()=>choose(r);$('actions').append(b);}choose(rows[0]);});
</script></html>
