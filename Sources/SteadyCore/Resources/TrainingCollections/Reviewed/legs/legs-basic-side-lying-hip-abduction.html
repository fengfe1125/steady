<body><main id="stage" aria-label="侧卧髋外展原创动作示意"></main><script>window.SteadyBasicLesson={"id":"legs-basic-side-lying-hip-abduction","key":"side-lying-hip-abduction","title":"侧卧髋外展","good":"骨盆叠放、抬腿适量","bad":"抬腿过高带动骨盆翻转","fix":"减小幅度，保持两侧髋上下叠放，膝盖朝前。","cue":"抬的是上侧腿，骨盆不跟着滚动。","primaryMuscles":["臀中肌"],"steps":["确认能安全上下地面，侧卧处平整、空间足够。","侧卧，肩与骨盆上下叠放，下臂支持头部，双腿伸直。","呼气，缓慢抬起上侧腿；膝盖保持朝前，不向天花板翻转。","骨盆开始侧倾前停止；不追求抬得越高越好。","吸气并受控落回上侧腿，不让腿自由下落。","腿完全落回后翻身换侧；结束后用手支撑起身。"],"detailExplanation":"四幅图依次显示起始、移动中、可控终点和返回。\n抬的是上侧腿，骨盆不跟着滚动。\n红色区域仅示意主要肌群，不表示测量结果。","mistakeExplanation":"左图正确：骨盆叠放、抬腿适量。\n右图错误：抬腿过高带动骨盆翻转。\n调整：减小幅度，保持两侧髋上下叠放，膝盖朝前。"};</script><script src="legs-basic-renderer.js"></script></body></html>
