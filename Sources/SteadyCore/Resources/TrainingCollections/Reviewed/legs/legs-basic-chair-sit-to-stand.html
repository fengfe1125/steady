<body><main id="stage" aria-label="椅子坐站原创动作示意"></main><script>window.SteadyBasicLesson={"id":"legs-basic-chair-sit-to-stand","key":"chair-sit-to-stand","title":"椅子坐站","good":"受控落座","bad":"向后跌坐","fix":"缩小幅度并放慢，确保臀部先找到椅面。","cue":"膝与脚尖同向，整脚掌踩稳。","primaryMuscles":["股四头肌","臀大肌"],"steps":["椅子靠稳，双脚能平放地面，身后留出坐回空间。","坐在椅子前部，双脚约髋宽，躯干轻向前倾。","双脚压地，用腿缓慢站起；不甩手借力。","站直即可，不向后顶腰。","屈髋屈膝，控制臀部坐回椅面，不向后跌坐。","最后一次坐稳后休息，再起身离开椅子。"],"detailExplanation":"四幅图依次显示起始、移动中、可控终点和返回。\n膝与脚尖同向，整脚掌踩稳。\n红色区域仅示意主要肌群，不表示测量结果。","mistakeExplanation":"左图正确：受控落座。\n右图错误：向后跌坐。\n调整：缩小幅度并放慢，确保臀部先找到椅面。"};</script><script src="legs-basic-renderer.js"></script></body></html>
