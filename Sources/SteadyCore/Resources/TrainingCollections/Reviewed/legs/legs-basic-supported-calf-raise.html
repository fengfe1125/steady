<body><main id="stage" aria-label="扶稳双腿提踵原创动作示意"></main><script>window.SteadyBasicLesson={"id":"legs-basic-supported-calf-raise","key":"supported-calf-raise","title":"扶稳双腿提踵","good":"前掌固定、轻扶稳定","bad":"抬脚趾或向前扑","fix":"缩小抬升幅度，保持前掌接地，手只辅助平衡。","cue":"脚跟升降，前脚掌不离开地面。","primaryMuscles":["腓肠肌","比目鱼肌"],"steps":["检查固定支撑物牢固，不用会滑动的轻椅。","双脚平放、约髋宽，一手轻扶固定支撑，身体直立。","缓慢抬起两侧脚跟，前脚掌和脚趾保持接地。","停在能稳住的高度；不向支撑物前扑。","脚跟缓慢落回地面，不弹跳。","双脚落稳后再松开手，原地休息。"],"detailExplanation":"四幅图依次显示起始、移动中、可控终点和返回。\n脚跟升降，前脚掌不离开地面。\n红色区域仅示意主要肌群，不表示测量结果。","mistakeExplanation":"左图正确：前掌固定、轻扶稳定。\n右图错误：抬脚趾或向前扑。\n调整：缩小抬升幅度，保持前掌接地，手只辅助平衡。"};</script><script src="legs-basic-renderer.js"></script></body></html>
