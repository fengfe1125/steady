<body><main id="stage" aria-label="无负重髋铰链原创动作示意"></main><script>window.SteadyBasicLesson={"id":"legs-basic-unloaded-hip-hinge","key":"unloaded-hip-hinge","title":"无负重髋铰链","good":"髋向后折、背部稳定","bad":"屈膝变深蹲或弯腰找地面","fix":"减少前倾幅度，先让臀部向后移动，不追求双手触地。","cue":"这是髋部折叠，动画膝盖只保持轻微弯曲。","primaryMuscles":["臀大肌","腘绳肌"],"steps":["不拿哑铃，身后留出臀部后移空间。","双脚约髋宽，膝微屈，双手轻放髋部。","臀部向后推，躯干随髋前倾，膝弯曲幅度基本保持。","到大腿后侧出现轻张力且背部可控的位置停住。","双脚压地，髋部向前回到直立；不向后反弓。","站稳放松；能稳定完成后才考虑学习负重RDL。"],"detailExplanation":"四幅图依次显示起始、移动中、可控终点和返回。\n这是髋部折叠，动画膝盖只保持轻微弯曲。\n红色区域仅示意主要肌群，不表示测量结果。","mistakeExplanation":"左图正确：髋向后折、背部稳定。\n右图错误：屈膝变深蹲或弯腰找地面。\n调整：减少前倾幅度，先让臀部向后移动，不追求双手触地。"};</script><script src="legs-basic-renderer.js"></script></body></html>
